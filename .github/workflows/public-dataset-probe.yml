name: Fluvius public dataset discovery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-dataset-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public Fluvius dataset metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          dataset="1_50-verbruiksprofielen-dm-elek-kwartierwaarden-voor-een-volledig-jaar"
          roots=["https://opendata.fluvius.be", "https://fluvius.opendatasoft.com"]
          paths=[f"/api/explore/v2.1/catalog/datasets/{dataset}",f"/api/explore/v2.1/catalog/datasets/{dataset}/attachments",f"/api/v2/catalog/datasets/{dataset}"]
          for root in roots:
              for path in paths:
                  url=root+path
                  print("TRY",url,flush=True)
                  try:
                      request=urllib.request.Request(url,headers={"User-Agent":"umig6-metering-quality/0.5 (open benchmark, contact via GitHub)", "Accept":"application/json"})
                      with urllib.request.urlopen(request,timeout=12) as response:
                          data=json.load(response)
                      print("OK top-level keys",list(data)[:18],flush=True)
                      print("ATTACHMENTS",json.dumps(data.get("attachments",data.get("metas",{}).get("attachments",[])),ensure_ascii=False)[:14000],flush=True)
                      if isinstance(data,list):
                          print("ITEMS",json.dumps(data[:6],ensure_ascii=False)[:14000],flush=True)
                  except Exception as e:
                      print("ERROR",type(e).__name__,str(e)[:220],flush=True)
          PY
