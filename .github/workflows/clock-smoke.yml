name: Public Fluvius DST clock smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clock-smoke.yml'
permissions:
  contents: read
jobs:
  verify-local-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Evaluate complete source clock from one official category
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_SUBMIT_ARGS: '--driver-memory 3g pyspark-shell'
          BENCH_ENVIRONMENT: github-hosted-ubuntu-spark-local-dst-clock
        run: |
          python examples/benchmark_public_fluvius.py --max-files 1 --check-local-clock --output clock-smoke-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-fluvius-dst-clock-metrics
          path: clock-smoke-results.json
          if-no-files-found: ignore
          retention-days: 30
