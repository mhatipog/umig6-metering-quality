name: Synthetic Spark benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/benchmark_spark.py'
      - 'src/umig6_metering_quality/rulebook.py'
      - '.github/workflows/benchmark.yml'
permissions:
  contents: read
jobs:
  local-spark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run 1 million row synthetic benchmark
        env:
          BENCH_ENVIRONMENT: github-hosted-ubuntu-spark-local-not-databricks
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          python examples/benchmark_spark.py \
            --rows 1000000 --partitions 8 --shuffle-partitions 16 \
            --workload all --output-json benchmark.json
          cat benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-spark-benchmark
          path: benchmark.json
          if-no-files-found: ignore
          retention-days: 14
