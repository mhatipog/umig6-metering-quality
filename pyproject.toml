[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umig6-metering-quality"
version = "0.2.0"
description = "Audit-ready PySpark data quality and correction lineage for Belgian electricity metering pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Metin Hatipogullari"}]
keywords = ["umig6", "mig6", "belgium", "energy", "metering", "pyspark", "data-quality", "reconciliation", "fluvius", "atrias"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: Database", "Topic :: Scientific/Engineering :: Information Analysis"]
dependencies = ["pyspark>=3.5,<5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
